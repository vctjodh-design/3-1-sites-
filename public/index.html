<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Football fixtures, results, match details and 1X2 odds for any date, scraped from BetExplorer." />
    <title>Football Fixtures</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f7f8f9'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2323272d' stroke-width='2'/%3E%3Cpath d='M16 8l3.2 2.3-1.2 3.7h-4L12.8 10.3z' fill='%2323272d'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/styles.css?v=14" />
  </head>
  <body>
    <div class="app">
      <div id="list-view">
        <header class="topbar">
          <div class="date-pill">
            <button class="arrow-btn" id="prev-day" type="button" aria-label="Previous day">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M14.5 6.5 9 12l5.5 5.5" />
              </svg>
            </button>
            <button
              class="date-btn"
              id="date-btn"
              type="button"
              aria-haspopup="dialog"
              aria-expanded="false"
              aria-controls="calendar"
            >
              <span id="date-label">Today</span>
              <svg class="calendar-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="16" rx="2.5" />
                <path d="M8 3v4M16 3v4M3 10h18" />
              </svg>
            </button>
            <button class="arrow-btn" id="next-day" type="button" aria-label="Next day">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9.5 6.5 15 12l-5.5 5.5" />
              </svg>
            </button>
          </div>

          <div class="market-pill" title="1X2 match odds">
            <span>1X2</span>
            <svg viewBox="0 0 10 6" aria-hidden="true">
              <path d="m1 1 4 4 4-4" />
            </svg>
          </div>

          <div class="calendar" id="calendar" role="dialog" aria-label="Choose a date" hidden>
            <div class="cal-head">
              <button class="cal-nav" id="cal-prev" type="button" aria-label="Previous month">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6.5 9 12l5.5 5.5" /></svg>
              </button>
              <div class="cal-month" id="cal-month" aria-live="polite"></div>
              <button class="cal-nav" id="cal-next" type="button" aria-label="Next month">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6.5 15 12l-5.5 5.5" /></svg>
              </button>
            </div>
            <div class="cal-weekdays" aria-hidden="true">
              <span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
            </div>
            <div class="cal-grid" id="cal-grid"></div>
            <div class="cal-foot">
              <button class="cal-today" id="cal-today" type="button">Jump to today</button>
            </div>
          </div>
        </header>

        <div class="board">
          <div class="col-head" aria-hidden="true">
            <div class="col-odds"><span>1</span><span>X</span><span>2</span></div>
          </div>
          <main class="fixtures" id="fixtures" aria-live="polite" aria-busy="true"></main>
        </div>

        <footer class="foot">
          <span>Only fixtures listed on both <a href="https://www.betexplorer.com/" target="_blank" rel="noopener noreferrer">BetExplorer</a> and <a href="https://www.statshub.com/" target="_blank" rel="noopener noreferrer">StatsHub</a></span>
          <span id="foot-time">Odds from BetExplorer · kick-off times as listed there.</span>
        </footer>
      </div>

      <section class="detail" id="detail-view" hidden aria-label="Match details">
        <header class="detail-bar">
          <button class="detail-back" id="detail-back" type="button" aria-label="Back to fixtures">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" /></svg>
          </button>
          <div class="detail-bar-title" id="detail-title">Match details</div>
          <a
            class="detail-external"
            id="detail-external"
            href="https://www.betexplorer.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open this match on BetExplorer"
            title="Open on BetExplorer"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14 4h6v6M20 4l-9 9M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6" />
            </svg>
          </a>
        </header>
        <div class="detail-body" id="detail-body"></div>
      </section>
    </div>

    <script src="/app.js?v=14" defer></script>
    <script src="/report.js?v=14" defer></script>
    <script src="/detail.js?v=14" defer></script>
  </body>
</html>
